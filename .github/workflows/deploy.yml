name: Scrape and Deploy

on:
  push:
    branches:
      - main

  schedule:
    # Frequent updates through October 10, 2026
    - cron: '17 0,8,10,12,14,16,18,20,22 * * *'
      timezone: 'Europe/Istanbul'

    # Daily update from October 11 onward (after Add-Drop period)
    - cron: '0 6 * * *'
      timezone: 'Europe/Istanbul'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check-schedule:
    runs-on: ubuntu-latest

    outputs:
      should_run: ${{ steps.date-logic.outputs.run }}

    steps:
      - name: Evaluate Date Schedule
        id: date-logic
        run: |
          # Always run for pushes and manual runs
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_DATE=$(TZ=Europe/Istanbul date +"%Y-%m-%d")
          CUTOFF="2026-10-10"
          SCHEDULE="${{ github.event.schedule }}"

          echo "Türkiye date: $CURRENT_DATE"
          echo "Triggered cron: $SCHEDULE"

          if [[ "$SCHEDULE" == "0 6 * * *" ]]; then
            # Daily 06:00 job only runs starting October 11
            if [[ "$CURRENT_DATE" > "$CUTOFF" ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "Still in Add-Drop period. Skipping daily cron."
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Frequent jobs run through October 10 inclusive
            if [[ "$CURRENT_DATE" > "$CUTOFF" ]]; then
              echo "Add-Drop period has ended. Skipping frequent cron."
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  scrape-and-deploy:
    needs: check-schedule
    if: needs.check-schedule.outputs.should_run == 'true'

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Python Dependencies
        run: python -m pip install -r scraper/requirements.txt

      - name: Install Node Dependencies
        run: npm ci

      - name: Fetch METU Offerings
        run: npm run fetch-all

      - name: Commit Updated Course Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/data/offerings/

          if ! git diff --staged --quiet; then
            git commit -m "Auto-update course offerings"
            git pull --rebase origin main
            git push
          else
            echo "No offering changes detected."
          fi

      - name: Build Frontend
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4