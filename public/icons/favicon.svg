<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Modern Squircle Arkaplan -->
  <path d="M 50,0 C 10,0 0,10 0,50 C 0,90 10,100 50,100 C 90,100 100,90 100,50 C 100,10 90,0 50,0 Z" fill="#CE0026" />
  
  <!-- Takvim Ana Gövde (Kalın, yuvarlatılmış köşeler) -->
  <rect x="20" y="24" width="60" height="60" rx="14" fill="none" stroke="#FFFFFF" stroke-width="8" />
  
  <!-- Takvim Başlık Çizgisi -->
  <line x1="20" y1="46" x2="80" y2="46" stroke="#FFFFFF" stroke-width="8" />
  
  <!-- Ajanda Spiralleri / Üst Halkalar -->
  <rect x="32" y="14" width="8" height="18" rx="4" fill="#FFFFFF" />
  <rect x="60" y="14" width="8" height="18" rx="4" fill="#FFFFFF" />
  
  <!-- Ders Programı Blokları (Asimetrik, dinamik görünüm) -->
  <rect x="32" y="56" width="36" height="8" rx="4" fill="#FFFFFF" />
  <rect x="32" y="68" width="20" height="8" rx="4" fill="#FFFFFF" />
</svg>
