<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="metu-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E31837" /> <!-- Bright Crimson -->
      <stop offset="100%" stop-color="#9E0A20" /> <!-- Deep Red -->
    </linearGradient>
  </defs>
  
  <!-- Smooth Dark Background -->
  <rect width="100" height="100" rx="24" fill="#18181B" />

  <!-- Timetable Columns (representing scheduled courses) -->
  
  <!-- Monday -->
  <rect x="18" y="24" width="16" height="32" rx="6" fill="url(#metu-red)" />
  <rect x="18" y="62" width="16" height="14" rx="5" fill="#3F3F46" />

  <!-- Wednesday -->
  <rect x="42" y="24" width="16" height="16" rx="5" fill="#3F3F46" />
  <rect x="42" y="46" width="16" height="30" rx="6" fill="url(#metu-red)" />

  <!-- Friday -->
  <rect x="66" y="24" width="16" height="24" rx="6" fill="url(#metu-red)" />
  <rect x="66" y="54" width="16" height="22" rx="6" fill="#3F3F46" />
</svg>
